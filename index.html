<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Futbol Takip</title>
  <meta name="description" content="Takip ettiğin takımların canlı skorları, fikstürü ve puan durumu">
  <meta name="theme-color" content="#0e1512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Futbol Takip">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikonlar/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ust">
    <div class="ust-ic">
      <div class="marka">
        <img src="ikonlar/ikon.svg" alt="" width="28" height="28">
        <h1>Futbol Takip</h1>
      </div>
      <button class="yenile" id="yenileBtn" aria-label="Yenile" title="Yenile">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
    <p class="durum-satiri" id="durumSatiri">Yükleniyor…</p>
  </header>

  <main id="icerik" class="icerik" tabindex="-1"></main>

  <nav class="alt-menu" aria-label="Bölümler">
    <button data-sekme="takimlar" class="aktif">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3z"/></svg>
      <span>Takımlarım</span>
    </button>
    <button data-sekme="maclar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z"/></svg>
      <span>Maçlar</span>
    </button>
    <button data-sekme="puan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 20h4V10H4v10zm6 0h4V4h-4v16zm6 0h4v-7h-4v7z"/></svg>
      <span>Puan</span>
    </button>
    <button data-sekme="ekle">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>Ekle</span>
    </button>
    <button data-sekme="hesap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9zm0 2c-3.3 0-9 1.7-9 5v2h18v-2c0-3.3-5.7-5-9-5z"/></svg>
      <span>Hesap</span>
    </button>
  </nav>

  <div class="bildirim-kutusu" id="tost" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
